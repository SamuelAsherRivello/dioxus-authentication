[package]
name = "ui"
version = "0.1.0"
edition = "2021"

[features]
default = []

[dependencies]
authentication = { workspace = true }
dioxus = { workspace = true, features = ["router"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components.git", rev = "11e57d00f5a69eed69519dae7a4e735fa6735ca3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dioxus-i18n = "0.5.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Location",
    "Storage",
    "Window",
] }
